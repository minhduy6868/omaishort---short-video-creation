name: release-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build Windows portable bundle
        shell: pwsh
        env:
          OMAISHORT_CLOUD_API_URL: ${{ vars.OMAISHORT_CLOUD_API_URL }}
        run: .\scripts\build_portable_windows.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omaishort-win-x64
          path: |
            dist/omaishort-win-x64.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: omaishort ${{ inputs.release_tag || github.ref_name }} (Windows Portable)
          generate_release_notes: true
          files: |
            dist/omaishort-win-x64.zip
            dist/SHA256SUMS.txt
